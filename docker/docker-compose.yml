version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiwse
      POSTGRES_PASSWORD: aiwse_password
      POSTGRES_DB: aiwse_db
    ports:
      - "5432:5432"
    volumes:
      - aiwse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwse -d aiwse_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aiwse:aiwse_password@db:5432/aiwse_db
      JWT_SECRET_KEY: change-me-to-the-shared-signing-secret
      JWT_ALGORITHM: HS256
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-1.5-pro
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  aiwse_pgdata:
